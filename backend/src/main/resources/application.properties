spring.application.name=booklify-api
server.port=8080
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/booklify}
spring.data.mongodb.auto-index-creation=true
booklify.jwt.secret=${JWT_SECRET:booklify-dev-secret-change-this-to-a-long-random-secret-key-2026}
booklify.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
